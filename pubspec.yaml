name: mahnegar
description: تقویم فارسی ماه‌نگار با رویدادها، کارها، نجوم و همگام‌سازی تقویم دستگاه.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shamsi_date: ^1.0.4
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  device_calendar_plus: ^0.8.1
  astronomia: ^1.1.1
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

# نکته فونت:
# برای رعایت مجوز IRANSans، فایل فونت داخل مخزن عمومی قرار نگرفته است.
# در صورت داشتن مجوز، خانواده IRANSans را به assets/fonts اضافه و در این بخش معرفی کنید.
