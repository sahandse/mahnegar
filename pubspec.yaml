  shared_preferences: ^2.5.3
  device_calendar_plus: ^0.8.1
  astronomia: ^1.1.1
  flutter_local_notifications: ^19.5.0
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
