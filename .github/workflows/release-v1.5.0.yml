name: Publish MahNegar v1.5.0

on:
  push:
    branches:
      - release/v1.5.0

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/apk dist/aab
          gh run download 37198338743 --repo "$GITHUB_REPOSITORY" --name mahnegar-apk --dir dist/apk
          gh run download 37198338743 --repo "$GITHUB_REPOSITORY" --name mahnegar-aab --dir dist/aab
          cp dist/apk/app-release.apk dist/mahnegar-1.5.0.apk
          cp dist/aab/app-release.aab dist/mahnegar-1.5.0.aab
          sha256sum dist/mahnegar-1.5.0.apk dist/mahnegar-1.5.0.aab > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.5.0 \
            dist/mahnegar-1.5.0.apk \
            dist/mahnegar-1.5.0.aab \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target f45a1f38a4c957ae2d106ff802a0982affe134ee \
            --title "ماه‌نگار 1.5.0" \
            --notes "## ماه‌نگار 1.5.0\n\nنسخه جدید با بخش اوقات کواکب و Jupiter Alarm.\n\n### تغییرات مهم\n- صفحه کامل اوقات کواکب\n- نمایش ساعت فعلی و حاکم آن\n- محاسبه ۱۲ ساعت روز و ۱۲ ساعت شب بر اساس طلوع و غروب محلی\n- ترتیب سنتی کلدانی کواکب\n- نمایش نزدیک‌ترین ساعت مشتری\n- Jupiter Alarm با هشدار همان لحظه یا ۵/۱۰/۱۵ دقیقه قبل\n- محاسبه بر اساس شهر انتخابی یا GPS\n- بازسازی خودکار هشدارهای مشتری در شروع برنامه\n- لینک مستقیم از بخش آسمان و نور\n- تست خودکار منطق ساعات کواکب و حاکم روزها\n\n### بررسی کیفیت\nAnalyze، Test، APK و AAB در GitHub Actions با موفقیت اجرا شده‌اند.\n\nفایل APK برای نصب مستقیم و فایل AAB برای انتشار در مارکت‌ها ضمیمه شده است.\n\nیادآوری: بخش اوقات کواکب به‌عنوان مرجع سنتی/فرهنگی ارائه می‌شود و اثر علمی یا پیش‌بینی قطعی ادعا نمی‌کند."
