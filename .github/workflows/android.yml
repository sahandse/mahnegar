name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org ir.sahand --project-name mahnegar .
          fi

      - name: Apply final MahNegar branding
        run: |
          python3 tool/apply_branding.py
          python3 - <<'PY'
          from pathlib import Path
          import base64

          source = Path('assets/branding/mahnegar_logo.webp.b64')
          logo = base64.b64decode(source.read_text().strip())

          drawable = Path('android/app/src/main/res/drawable-nodpi')
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / 'mahnegar_master.webp').write_bytes(logo)

          for density in ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']:
              target = Path(f'android/app/src/main/res/mipmap-{density}')
              target.mkdir(parents=True, exist_ok=True)
              (target / 'ic_launcher.webp').write_bytes(logo)
          PY

      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              'android.permission.READ_CALENDAR',
              'android.permission.WRITE_CALENDAR',
              'android.permission.POST_NOTIFICATIONS',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace(marker, marker + f'\n    <uses-permission android:name="{permission}" />')
          text = text.replace('android:label="mahnegar"', 'android:label="ماه‌نگار"')
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher"')
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              g = gradle.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              if 'isCoreLibraryDesugaringEnabled' not in g:
                  g = g.replace(
                      'compileOptions {\n        sourceCompatibility',
                      'compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility',
                  )
              if 'desugar_jdk_libs' not in g:
                  g += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
              gradle.write_text(g)
          PY

          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_mahnegar.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M15.8,2.2c-4.6,1.2 -7.5,5.8 -6.1,10.3 1.4,4.5 6.2,6.9 10.5,5.1 -2.3,0.3 -4.7,-0.5 -6.2,-2.3 -2.9,-3.3 -2.2,-8.5 1.8,-13.1z"/>
            <path android:fillColor="#FFFFFFFF" android:pathData="M8,10h8.8c0.7,0 1.2,0.5 1.2,1.2v7.1c0,0.7 -0.5,1.2 -1.2,1.2H8c-0.7,0 -1.2,-0.5 -1.2,-1.2v-7.1C6.8,10.5 7.3,10 8,10zM8.2,12.1h8.4v1.3H8.2zM9.1,14.6h1.5v1.5H9.1zM11.8,14.6h1.5v1.5h-1.5zM14.5,14.6h1.5v1.5h-1.5z"/>
          </vector>
          XML

          cat > android/app/src/main/res/drawable/launch_background.xml <<'XML'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item>
              <shape android:shape="rectangle">
                <solid android:color="#08152F" />
              </shape>
            </item>
            <item android:gravity="center" android:width="180dp" android:height="180dp">
              <bitmap android:gravity="fill" android:src="@drawable/mahnegar_master" />
            </item>
          </layer-list>
          XML

          cat > android/app/src/main/res/drawable-v21/launch_background.xml <<'XML'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item>
              <shape android:shape="rectangle">
                <solid android:color="#08152F" />
              </shape>
            </item>
            <item android:gravity="center" android:width="180dp" android:height="180dp">
              <bitmap android:gravity="fill" android:src="@drawable/mahnegar_master" />
            </item>
          </layer-list>
          XML

      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Build AAB
        run: flutter build appbundle --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mahnegar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: mahnegar-aab
          path: build/app/outputs/bundle/release/app-release.aab
