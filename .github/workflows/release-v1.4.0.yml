name: Publish MahNegar v1.4.0

on:
  push:
    branches:
      - release/v1.4.0

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/apk dist/aab
          gh run download 37042326646 --repo "$GITHUB_REPOSITORY" --name mahnegar-apk --dir dist/apk
          gh run download 37042326646 --repo "$GITHUB_REPOSITORY" --name mahnegar-aab --dir dist/aab
          cp dist/apk/app-release.apk dist/mahnegar-1.4.0.apk
          cp dist/aab/app-release.aab dist/mahnegar-1.4.0.aab
          sha256sum dist/mahnegar-1.4.0.apk dist/mahnegar-1.4.0.aab > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.0 \
            dist/mahnegar-1.4.0.apk \
            dist/mahnegar-1.4.0.aab \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target d3fa46be02dec9b96f317694ffdfc539e462d495 \
            --title "ماه‌نگار 1.4.0" \
            --notes "## ماه‌نگار 1.4.0\n\nنسخه نهایی آماده انتشار با طراحی مینیمال‌تر و ابزارهای نجومی کامل‌تر.\n\n### تغییرات مهم\n- GPS واقعی برای انتخاب موقعیت\n- قطب‌نمای زنده\n- Golden Hour و Blue Hour بر پایه زاویه خورشید\n- تقویم ماهانه فاز ماه\n- اعلان فازهای مهم ماه و قمر در عقرب\n- ویجت صفحه اصلی و بروزرسانی خودکار\n- گسترش شهرهای ایران و چند شهر بین‌المللی\n- بهبود داشبورد و تجربه کاربری\n\n### بررسی کیفیت\nAnalyze، Test، APK و AAB در GitHub Actions با موفقیت اجرا شده‌اند.\n\nفایل APK برای نصب مستقیم و فایل AAB برای انتشار در مارکت‌ها ضمیمه شده است."
